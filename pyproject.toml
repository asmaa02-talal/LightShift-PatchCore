[project]
name = "lightshift-patchcore"
version = "0.1.0"
description = "Robust industrial anomaly detection under illumination shifts"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "anomalib>=2,<3",
  "torch>=2",
  "torchvision>=0.17",
  "timm>=1",
  "numpy<2.3",
  "opencv-python",
  "albumentations",
  "scikit-learn",
  "scipy",
  "pandas",
  "matplotlib",
  "seaborn",
  "hydra-core",
  "omegaconf",
  "mlflow",
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "streamlit",
  "pillow",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "pre-commit",
  "ipykernel",
  "jupyter",
]
faiss = ["faiss-cpu"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
